<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🎯 Focus mode</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      min-height: 100vh;
      background: #0f0f1e;
      color: #e8e8ee;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }
    .wrap {
      max-width: 540px; margin: 0 auto;
      padding: 18vh 24px 6vh;
      text-align: center;
    }
    .icon { font-size: 64px; margin-bottom: 12px; }
    h1 { margin: 0 0 8px; font-size: 28px; font-weight: 600; }
    .host {
      color: #e94560;
      font-family: 'SF Mono', 'Consolas', monospace;
      word-break: break-all;
    }
    p { color: #888; font-size: 14px; line-height: 1.6; margin: 6px 0; }
    .hint {
      margin-top: 28px; font-size: 12px; color: #555;
      padding: 12px 16px;
      background: #16213e;
      border-radius: 8px;
      display: inline-block;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="icon">🎯</div>
    <h1>Focus mode</h1>
    <p><span class="host" id="host">…</span> is blocked.</p>
    <p>Get back to what matters.</p>
    <div class="hint">Open the SuperLevels popup → 🎯 Focus tab to toggle this site off or turn focus mode off.</div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const host = params.get("host") || "this site";
    document.getElementById("host").textContent = host;
    document.title = "🎯 " + host + " is blocked";
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>📸 Full-page screenshot</title>
  <style>
    html, body { margin: 0; background: #0f0f1e; color: #e8e8ee; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
    .bar {
      position: sticky; top: 0; z-index: 1;
      display: flex; align-items: center; gap: 12px;
      padding: 10px 16px; background: #16213e; border-bottom: 1px solid #2a2a4a;
    }
    .info { flex: 1; min-width: 0; }
    #title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #meta { font-size: 12px; color: #888; margin-top: 2px; }
    .status { font-size: 12px; color: #aaa; margin-top: 2px; }
    .status.ok { color: #4caf50; }
    .status.err { color: #e94560; }
    button {
      padding: 8px 14px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer;
      border: 1px solid #2a2a4a; background: #0f1e3d; color: #ddd;
    }
    button.primary { background: #e94560; border-color: #e94560; color: #fff; }
    button:disabled { opacity: 0.4; cursor: default; }
    #preview { padding: 16px; text-align: center; }
    #preview img { max-width: 100%; box-shadow: 0 2px 16px rgba(0,0,0,0.5); background: #fff; }
    #preview iframe { width: 100%; height: calc(100vh - 100px); border: 0; background: #fff; }
  </style>
</head>
<body>
  <div class="bar">
    <div class="info">
      <div id="title">Full-page screenshot</div>
      <div id="meta"></div>
      <div id="status" class="status">Starting…</div>
    </div>
    <button id="copyBtn" disabled>Copy image</button>
    <button id="saveBtn" class="primary" disabled>Save PNG</button>
  </div>
  <div id="preview"></div>
  <script src="screenshot.js"></script>
</body>
</html>
